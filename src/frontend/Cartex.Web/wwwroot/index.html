<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartex POS</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#166534" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #out { width: 100%; height: 100%; }
        #out canvas { touch-action: none; }
        #splash { display: flex; align-items: center; justify-content: center; height: 100vh; background: #111318; color: #F1F5F9; font-family: sans-serif; font-size: 24px; }
    </style>
</head>
<body>
    <div id="out"><div id="splash">Loading Cartex POS...</div></div>
    <script type="module" src="./main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Avalonia WASM canvas needs tabindex for keyboard focus
        const observer = new MutationObserver(() => {
            const canvas = document.querySelector('canvas');
            if (canvas && !canvas.dataset.avlSetup) {
                canvas.dataset.avlSetup = '1';
                canvas.setAttribute('tabindex', '0');
            }
        });
        observer.observe(document.getElementById('out'), { childList: true, subtree: true });

        // Mobile IME fix for Avalonia WASM 11.3.x
        // Root cause: During active IME composition, Avalonia's managed code calls
        // setSurroundingText (sets input.value) and focusElement (calls focus()),
        // which cancels the browser's composition session on mobile.
        // Fix: Block value/selectionRange/focus writes on the input element while composing.
        (function() {
            const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            if (!isMobile) return;

            let composing = false;

            document.addEventListener('compositionstart', function() { composing = true; }, true);
            document.addEventListener('compositionend', function() { composing = false; }, true);

            const origFocus = HTMLElement.prototype.focus;
            HTMLElement.prototype.focus = function(opts) {
                if (composing && this.classList && this.classList.contains('avalonia-input-element')) return;
                return origFocus.call(this, opts);
            };

            function patchInput(el) {
                if (el._cartexPatched) return;
                el._cartexPatched = true;

                const valueDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
                Object.defineProperty(el, 'value', {
                    get() { return valueDesc.get.call(this); },
                    set(v) { if (!composing) valueDesc.set.call(this, v); },
                    configurable: true
                });

                const origSetRange = HTMLInputElement.prototype.setSelectionRange;
                el.setSelectionRange = function() {
                    if (composing) return;
                    return origSetRange.apply(this, arguments);
                };
            }

            new MutationObserver(function() {
                document.querySelectorAll('.avalonia-input-element').forEach(patchInput);
            }).observe(document.getElementById('out'), { childList: true, subtree: true });
        })();
    </script>
</body>
</html>

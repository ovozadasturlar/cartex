<div class="page" *transloco="let t">
  <cx-page-header [title]="t('product_types')" [subtitle]="t('product_types_subtitle')">
    @if (canExport) {
      <button matButton="outlined" (click)="exportCsv()">
        <mat-icon>download</mat-icon>{{ t('export') }}
      </button>
    }
    @if (canCreate) {
      <button mat-flat-button (click)="openCreate()"><mat-icon>add</mat-icon>{{ t('add') }}</button>
    }
  </cx-page-header>

  <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput #q [placeholder]="t('search')" (input)="search.set(q.value.trim())" />
  </mat-form-field>

  <div class="cx-table-card">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    @if (items().length) {
      <div class="table-wrap">
        <table mat-table [dataSource]="items()">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
            <td mat-cell *matCellDef="let p" class="strong">{{ p.name }}</td>
          </ng-container>

          <ng-container matColumnDef="tracksExpiry">
            <th mat-header-cell *matHeaderCellDef>{{ t('tracks_expiry') }}</th>
            <td mat-cell *matCellDef="let p">
              @if (p.tracksExpiry) {
                <span class="cx-chip warn">{{ t('tracks_expiry') }}</span>
              } @else {
                —
              }
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns" [class.clickable]="canEdit" (click)="openEdit(row)"></tr>
        </table>
      </div>
    } @else if (!loading()) {
      <cx-empty-state [icon]="'style'" [message]="t('no_data')" />
    }
  </div>
</div>

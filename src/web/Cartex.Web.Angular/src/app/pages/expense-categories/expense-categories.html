<div class="page" *transloco="let t">
  <cx-page-header [title]="t('expense_categories')" [subtitle]="t('expense_categories_subtitle')">
    @if (canCreate) {
      <button matButton="filled" (click)="open()">
        <mat-icon>add</mat-icon>
        {{ t('add') }}
      </button>
    }
  </cx-page-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <div class="cx-table-card">
      @if (categories().length) {
        <table mat-table [dataSource]="categories()">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
            <td mat-cell *matCellDef="let c" class="strong">{{ c.name }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="act"></th>
            <td mat-cell *matCellDef="let c" class="act">
              @if (canEdit) {
                <button matIconButton (click)="open(c)" [title]="t('edit')">
                  <mat-icon>edit</mat-icon>
                </button>
              }
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let c; columns: columns"></tr>
        </table>
      } @else {
        <cx-empty-state icon="category" [message]="t('no_data')" />
      }
    </div>
  }
</div>

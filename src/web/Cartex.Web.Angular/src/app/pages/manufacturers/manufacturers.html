<div class="page" *transloco="let t">
  <cx-page-header [title]="t('manufacturers')" [subtitle]="t('manufacturers_subtitle')">
    @if (canManage) {
      <button mat-flat-button (click)="openCreate()"><mat-icon>add</mat-icon>{{ t('add') }}</button>
    }
  </cx-page-header>

  <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput #q [placeholder]="t('search')" (input)="search.set(q.value.trim())" />
  </mat-form-field>

  <div class="cx-table-card">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    @if (items().length) {
      <div class="table-wrap">
        <table mat-table [dataSource]="items()">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
            <td mat-cell *matCellDef="let m" class="strong">{{ m.name }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="num"></th>
            <td mat-cell *matCellDef="let m" class="num">
              @if (canManage) {
                <button mat-icon-button [title]="t('delete')" (click)="remove(m, $event)">
                  <mat-icon>delete</mat-icon>
                </button>
              }
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns" [class.clickable]="canManage" (click)="openEdit(row)"></tr>
        </table>
      </div>
    } @else if (!loading()) {
      <cx-empty-state [icon]="'factory'" [message]="t('no_data')" />
    }
  </div>
</div>

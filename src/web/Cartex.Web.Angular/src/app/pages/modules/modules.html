<ng-container *transloco="let t">
  <cx-page-header [title]="t('modules')" [subtitle]="t('modules_hint')" />

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="list">
    <div class="cx-card row" [class.off]="!multicurrencyLicensed()">
      <div class="who">
        <span class="name">{{ t('multicurrency_license') }}</span>
        <span class="code">multicurrency</span>
        @if (!multicurrencyLicensed()) {
          <span class="code">{{ t('multicurrency_not_in_tariff') }}</span>
        }
      </div>
      <mat-slide-toggle [checked]="multicurrencyLicensed()" disabled />
    </div>

    @for (m of modules(); track m.code) {
      <div class="cx-card row" [class.off]="!m.available">
        <div class="who">
          <span class="name">{{ m.name }}</span>
          <span class="code">{{ m.code }}</span>
          @if (!m.available) {
            <span class="code">{{ t('module_not_in_tariff') }}</span>
          }
        </div>
        <mat-slide-toggle
          [checked]="m.available && m.isEnabled"
          [disabled]="!canEdit || !m.available"
          (change)="toggle(m)"
        />
      </div>
    }
  </div>
</ng-container>

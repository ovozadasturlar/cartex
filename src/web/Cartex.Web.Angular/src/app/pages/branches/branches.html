<ng-container *transloco="let t">
  <cx-page-header [title]="t('branches')" [subtitle]="t('branches_subtitle')">
    <button mat-flat-button (click)="open(null)">
      <mat-icon>add</mat-icon>{{ t('add') }}
    </button>
  </cx-page-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <div class="cx-table-card">
      @if (branches().length) {
        <div class="scroll">
          <table mat-table [dataSource]="branches()">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
              <td mat-cell *matCellDef="let b" class="strong">{{ b.name }}</td>
            </ng-container>

            <ng-container matColumnDef="address">
              <th mat-header-cell *matHeaderCellDef>{{ t('address') }}</th>
              <td mat-cell *matCellDef="let b">{{ b.address || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="phone">
              <th mat-header-cell *matHeaderCellDef>{{ t('phone') }}</th>
              <td mat-cell *matCellDef="let b">{{ b.phone || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>{{ t('status') }}</th>
              <td mat-cell *matCellDef="let b">
                <span class="cx-chip" [class.ok]="b.isActive" [class.bad]="!b.isActive">
                  {{ t(b.isActive ? 'active' : 'inactive') }}
                </span>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let b; columns: cols" class="clickable" (click)="open(b)"></tr>
          </table>
        </div>
      } @else {
        <cx-empty-state icon="apartment" [message]="t('no_data')" />
      }
    </div>
  }
</ng-container>

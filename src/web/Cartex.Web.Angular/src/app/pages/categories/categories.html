<div class="page" *transloco="let t">
  <cx-page-header [title]="t('categories')" [subtitle]="t('categories_subtitle')">
    @if (canManage) {
      <button mat-flat-button (click)="openCreate()"><mat-icon>add</mat-icon>{{ t('add') }}</button>
    }
  </cx-page-header>

  <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput #q [placeholder]="t('search')" (input)="search.set(q.value.trim())" />
  </mat-form-field>

  <div class="cx-table-card">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    @if (items().length) {
      <div class="table-wrap">
        <table mat-table [dataSource]="items()">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
            <td mat-cell *matCellDef="let c" class="strong">{{ c.name }}</td>
          </ng-container>

          <ng-container matColumnDef="parent">
            <th mat-header-cell *matHeaderCellDef>{{ t('parent') }}</th>
            <td mat-cell *matCellDef="let c">{{ c.parentName || '—' }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>{{ t('description') }}</th>
            <td mat-cell *matCellDef="let c" class="muted">{{ c.description || '—' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns" [class.clickable]="canManage" (click)="openEdit(row)"></tr>
        </table>
      </div>
    } @else if (!loading()) {
      <cx-empty-state [icon]="'category'" [message]="t('no_data')" />
    }
  </div>
</div>

<ng-container *transloco="let t">
  <cx-page-header [title]="t('warehouses')" [subtitle]="t('warehouses_subtitle')">
    <button mat-flat-button (click)="open(null)">
      <mat-icon>add</mat-icon>{{ t('add') }}
    </button>
  </cx-page-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  } @else {
    <div class="cx-table-card">
      @if (warehouses().length) {
        <div class="scroll">
          <table mat-table [dataSource]="warehouses()">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>{{ t('name') }}</th>
              <td mat-cell *matCellDef="let w" class="strong">{{ w.name }}</td>
            </ng-container>

            <ng-container matColumnDef="branch">
              <th mat-header-cell *matHeaderCellDef>{{ t('branch') }}</th>
              <td mat-cell *matCellDef="let w">{{ w.branchName }}</td>
            </ng-container>

            <ng-container matColumnDef="online">
              <th mat-header-cell *matHeaderCellDef>{{ t('online_warehouse') }}</th>
              <td mat-cell *matCellDef="let w">
                @if (w.isOnline) {
                  <span class="cx-chip ok">{{ t('active') }}</span>
                } @else {
                  <span class="muted">—</span>
                }
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="cols"></tr>
            <tr mat-row *matRowDef="let w; columns: cols" class="clickable" (click)="open(w)"></tr>
          </table>
        </div>
      } @else {
        <cx-empty-state icon="warehouse" [message]="t('no_data')" />
      }
    </div>
  }
</ng-container>

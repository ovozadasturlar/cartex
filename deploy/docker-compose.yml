services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartex
      POSTGRES_USER: cartex
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env faylida majburiy}
    volumes:
      - cartex-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: muqimjon/cartex-api
    build:
      context: ..
      dockerfile: src/backend/Cartex.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Database=cartex;Username=cartex;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env faylida majburiy (64+ belgi)}
      Seed__DeveloperPassword: ${DEVELOPER_PASSWORD:?DEVELOPER_PASSWORD .env faylida majburiy}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD .env faylida majburiy}
      Barcode__Prefix: ${BARCODE_PREFIX:-CTX}
      Storage__LocalPath: /data/storage
      DataProtection__KeysPath: /data/keys
    volumes:
      - cartex-storage:/data/storage
      - cartex-keys:/data/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5015/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5015:5015"

  web:
    image: muqimjon/cartex-web
    build:
      context: ..
      dockerfile: src/web/Cartex.Web.Angular/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-cartex}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-}
    volumes:
      - cartex-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - web
    command: caddy reverse-proxy --from ${DOMAIN:-} --to web:80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data


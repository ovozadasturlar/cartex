name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build src/backend/Cartex.Api/Cartex.Api.csproj -c Release

      - name: Architecture tests
        run: dotnet test tests/Cartex.ArchitectureTests/Cartex.ArchitectureTests.csproj -c Release

      - name: Unit tests
        run: dotnet test tests/Cartex.UnitTests/Cartex.UnitTests.csproj -c Release

      - name: Application integration tests
        run: dotnet test tests/Cartex.Application.Tests/Cartex.Application.Tests.csproj -c Release

      - name: API integration tests
        run: dotnet test tests/Cartex.Api.IntegrationTests/Cartex.Api.IntegrationTests.csproj -c Release

  qodana:
    name: Qodana analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Qodana Scan
        # The native Qodana IDE distributions fail to start on GitHub-hosted Linux
        # runners before analysis begins. Run the supported Docker linter in CI instead;
        # Rider/local Qodana remains native, as configured in qodana.yaml.
        uses: JetBrains/qodana-action@v2026.1.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: |
            --linter qodana-dotnet
            --within-docker true
            --no-build
          pr-mode: false
          # Do not persist Qodana caches while validating the new CI execution mode.
          use-caches: false
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
